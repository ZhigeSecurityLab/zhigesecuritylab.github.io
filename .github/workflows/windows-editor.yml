name: Build portable Windows editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build self-contained editor
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --contents-directory . --name ZhigeFacultyEditor --paths scripts --add-data "assets;assets" --add-data "content;content" --add-data "faculty_editor;faculty_editor" scripts/faculty.py
          Copy-Item (Get-Command gh).Source dist/ZhigeFacultyEditor/gh.exe
          Copy-Item portable/Start-Faculty-Editor.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/Start-Test-Editor.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/README-Windows.txt dist/ZhigeFacultyEditor/
      - name: Smoke test executable
        shell: pwsh
        run: |
          Copy-Item dist/ZhigeFacultyEditor smoke-editor -Recurse
          $process = Start-Process -FilePath smoke-editor/ZhigeFacultyEditor.exe -ArgumentList '--user','zhengfeiLian','--branch','faculty-editor-test','--port','18003' -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $state = Invoke-RestMethod -Uri 'http://127.0.0.1:18003/api/state' -TimeoutSec 2
                if ($state.owner -eq 'zhengfeiLian' -and $state.branch -eq 'faculty-editor-test') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { Get-Content smoke-out.txt; Get-Content smoke-err.txt; throw 'Portable editor did not start' }
            $profile = @{ en = @{ name = ''; role = ''; url = ''; bio_markdown = '## Windows preview check' }; zh = @{ name = ''; role = ''; url = ''; bio_markdown = '## 中文预览' }; avatar = '' }
            $body = @{ revision = $state.revision; profile = $profile; recruitment = $null } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri 'http://127.0.0.1:18003/api/save' -Method Post -ContentType 'application/json; charset=utf-8' -Headers @{ 'X-Editor-Token' = $state.token } -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) | Out-Null
            $preview = (Invoke-WebRequest -Uri 'http://127.0.0.1:18003/preview/people/faculty/').Content
            if (-not $preview.Contains('Windows preview check')) { throw 'Saved Faculty Markdown did not appear in preview' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Zhige-Faculty-Editor-Windows
          path: dist/ZhigeFacultyEditor/
          retention-days: 30
