name: Build portable Windows editor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Build self-contained editor
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onedir --contents-directory . --name ZhigeFacultyEditor --paths scripts --add-data "assets;assets" --add-data "content;content" --add-data "faculty_editor;faculty_editor" --add-data "student_editor;student_editor" scripts/faculty.py
          Copy-Item (Get-Command gh).Source dist/ZhigeFacultyEditor/gh.exe
          Copy-Item portable/Start-Faculty-Editor.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/Start-Faculty-Test.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/Faculty-README.txt dist/ZhigeFacultyEditor/
          Copy-Item portable/Start-Test-Editor.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/Start-Member-Editor.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/Start-Member-Test.bat dist/ZhigeFacultyEditor/
          Copy-Item portable/README-Windows.txt dist/ZhigeFacultyEditor/
      - name: Smoke test executable
        shell: pwsh
        run: |
          Copy-Item dist/ZhigeFacultyEditor smoke-editor -Recurse
          $process = Start-Process -FilePath smoke-editor/ZhigeFacultyEditor.exe -ArgumentList '--user','zhengfeiLian','--branch','faculty-editor-test','--port','18003' -PassThru -RedirectStandardOutput smoke-out.txt -RedirectStandardError smoke-err.txt
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $state = Invoke-RestMethod -Uri 'http://127.0.0.1:18003/api/state' -TimeoutSec 2
                if ($state.owner -eq 'zhengfeiLian' -and $state.branch -eq 'faculty-editor-test') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { Get-Content smoke-out.txt; Get-Content smoke-err.txt; throw 'Portable editor did not start' }
            if (-not (Test-Path 'smoke-editor/.local/faculty-baseline-zhengfeilian-faculty-editor-test.json')) { Get-Content smoke-out.txt; throw 'Remote HTTPS synchronization failed' }
            $profile = @{ en = @{ name = ''; role = ''; url = ''; bio_markdown = '## Windows preview check' }; zh = @{ name = ''; role = ''; url = ''; bio_markdown = '## 中文预览' }; avatar = '' }
            $body = @{ revision = $state.revision; profile = $profile; recruitment = $null } | ConvertTo-Json -Depth 10
            Invoke-RestMethod -Uri 'http://127.0.0.1:18003/api/save' -Method Post -ContentType 'application/json; charset=utf-8' -Headers @{ 'X-Editor-Token' = $state.token } -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) | Out-Null
            $preview = (Invoke-WebRequest -Uri 'http://127.0.0.1:18003/preview/people/faculty/').Content
            if (-not $preview.Contains('Windows preview check')) { throw 'Saved Faculty Markdown did not appear in preview' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          $member = Start-Process -FilePath dist/ZhigeFacultyEditor/ZhigeFacultyEditor.exe -ArgumentList '--student','--port','18004' -PassThru -RedirectStandardOutput member-out.txt -RedirectStandardError member-err.txt
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $state = Invoke-RestMethod -Uri 'http://127.0.0.1:18004/api/state' -TimeoutSec 2
                if ($state.student -eq $true -and $state.branch -eq 'main') { $ready = $true; break }
              } catch {}
            }
            if (-not $ready) { Get-Content member-out.txt; Get-Content member-err.txt; throw 'Member editor did not start' }
            $page = (Invoke-WebRequest -Uri 'http://127.0.0.1:18004/').Content
            if (-not $page.Contains('id="category"')) { throw 'Member editor page missing' }
          } finally { Stop-Process -Id $member.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: Zhige-Member-Editor-Windows
          path: dist/ZhigeFacultyEditor/
          retention-days: 30
      - name: Build signed official Python runtime Faculty package
        run: python scripts/package_windows_faculty.py
      - name: Verify official runtime editor
        shell: pwsh
        run: |
          $root = (Resolve-Path dist/FacultyOfficial).Path
          if ((Get-AuthenticodeSignature "$root/runtime/python.exe").Status -ne 'Valid') { throw 'Official Python signature invalid' }
          $p = Start-Process "$root/runtime/python.exe" -ArgumentList "$root/scripts/faculty.py",'--user','zhengfeiLian','--branch','faculty-ccf-test','--port','18008' -WorkingDirectory $root -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 40; $i++) {
              Start-Sleep -Seconds 1
              try { $s=Invoke-RestMethod 'http://127.0.0.1:18008/api/state'; if ($s.branch -eq 'faculty-ccf-test') {$ready=$true;break} } catch {}
            }
            if (-not $ready) { throw 'Official runtime editor failed startup' }
            $html=(Invoke-WebRequest 'http://127.0.0.1:18008/' -UseBasicParsing).Content
            if (-not $html.Contains('paper-title-search')) { throw 'Search UI missing' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          Remove-Item "$root/.local" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$root/_site" -Recurse -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: Zhige-Faculty-Editor-Windows
          path: dist/FacultyOfficial/
          retention-days: 30
